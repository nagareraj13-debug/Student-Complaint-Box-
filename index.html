<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Complaint Box - Smart Authentication</title>
    
    <!-- Real App Icon Settings -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Google Sign-In Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #080710; color: #ffffff; width: 100vw; min-height: 100vh; overflow: hidden; position: relative; }
        .background { width: 100%; height: 100vh; position: fixed; top: 0; left: 0; z-index: -1; }
        .shape { height: 400px; width: 400px; position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; }
        .shape1 { background: linear-gradient(135deg, #00F260, #0575E6); top: -150px; left: -150px; }
        .shape2 { background: linear-gradient(135deg, #0575E6, #00F260); bottom: -150px; right: -150px; }
        .login-card { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 40px 30px; border-radius: 24px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; backdrop-filter: blur(15px); text-align: center; z-index: 10; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .login-card::-webkit-scrollbar { display: none; }
        .login-card { -ms-overflow-style: none; scrollbar-width: none; }
        .title-text { font-size: 24px; font-weight: 600; margin-bottom: 25px; min-height: 70px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .toggle-box { position: relative; display: flex; background: rgba(255, 255, 255, 0.05); border-radius: 30px; margin: 0 auto 25px; width: 100%; max-width: 280px; transition: 0.3s; }
        .toggle-btn { position: absolute; width: 50%; height: 100%; background: linear-gradient(90deg, #00F260, #0575E6); border-radius: 30px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; left: 0; }
        .toggle-option { flex: 1; padding: 12px; text-align: center; z-index: 2; cursor: pointer; color: white; font-weight: 500; font-size: 14px; background: none; border: none; outline: none; transition: 0.3s; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #a4b0be; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 15px 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #ffffff; font-size: 14px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #00F260; background: rgba(255, 255, 255, 0.08); }
        .btn { width: 100%; background: #ffffff; color: #000000; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn:active { transform: scale(0.98); }
        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .divider span { padding: 0 15px; color: #a4b0be; font-size: 12px; }
        .signup-text { margin-top: 25px; font-size: 13px; color: #a4b0be; }
        .signup-text span { color: #00F260; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .signup-text span:hover { text-decoration: underline; }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .otp-section { display: none; }
        .toast-notification { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(15, 15, 25, 0.95); border: 1px solid #00F260; border-radius: 16px; padding: 15px 25px; display: flex; align-items: center; gap: 15px; z-index: 3000; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); min-width: 300px; backdrop-filter: blur(10px); }
        .toast-notification.show { top: 30px; }
        .toast-icon { font-size: 24px; background: rgba(0, 242, 96, 0.1); padding: 10px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .toast-content h4 { font-size: 15px; font-weight: 600; color: #00F260; margin-bottom: 3px; }
        .toast-content p { font-size: 12px; color: #dfe6e9; }
    </style>
</head>
<body>
    <!-- Google Auth Config -->
    <div id="g_id_onload"
         data-client_id="455118025681-rphn053eoe2pom4sjg1nispjtck44jnu.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div id="customToast" class="toast-notification">
        <div class="toast-icon" id="toastIcon">✅</div>
        <div class="toast-content"><h4 id="toastTitle">Success!</h4><p id="toastMessage">Action completed.</p></div>
    </div>
    
    <div class="background">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
    </div>

    <!-- MAIN LOGIN/SIGNUP CARD -->
    <div class="login-card">
        <div class="title-text" id="formTitle">Welcome to Student<br>Complaint Box 🏫</div>

        <!-- Student/Admin Toggle -->
        <div class="toggle-box" id="toggleBox">
            <div class="toggle-btn" id="toggleBtn"></div>
            <button type="button" class="toggle-option" onclick="switchForm('student')">Student</button>
            <button type="button" class="toggle-option" onclick="switchForm('admin')">Admin</button>
        </div>

        <!-- 1. STUDENT LOGIN FORM -->
        <div id="studentForm" class="form-section active">
            <div id="mobileSection">
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="mobileNumber" placeholder="Enter 10-digit mobile number" maxlength="10">
                </div>
                <button class="btn" onclick="sendOTP()" id="sendOtpBtn">Get OTP</button>

                <!-- REAL GOOGLE LOGIN BUTTON -->
                <div class="divider"><span>OR</span></div>
                <div style="display: flex; justify-content: center; width: 100%;">
                    <div class="g_id_signin" 
                         data-type="standard" 
                         data-shape="rectangular" 
                         data-theme="filled_black" 
                         data-text="continue_with" 
                         data-size="large" 
                         data-logo_alignment="left">
                    </div>
                </div>

                <div class="signup-text">Don't have an account? <span onclick="toggleSignupView(true)">Sign Up</span></div>
            </div>

            <!-- Login OTP Section -->
            <div id="otpSection" class="otp-section">
                <p style="color: #00F260; font-size: 13px; margin-bottom: 15px;">OTP sent to <span id="displayNum"></span></p>
                <div class="input-group">
                    <label>Enter 4-Digit OTP</label>
                    <input type="number" id="otpInput" placeholder="0000" maxlength="4">
                </div>
                <button class="btn" onclick="verifyOTP()" id="verifyOtpBtn">Verify & Login</button>
                <p style="margin-top: 20px; font-size: 12px; color: #a4b0be; cursor: pointer;" onclick="location.reload()">← Change Number</p>
            </div>
        </div>

        <!-- 2. ADMIN LOGIN FORM -->
        <div id="adminForm" class="form-section">
            <div class="input-group">
                <label>Admin ID / Username</label>
                <input type="text" id="adminUser" placeholder="Enter admin username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="Enter password">
            </div>
            <button class="btn" onclick="handleAdminLogin()">Admin Login</button>
        </div>

        <!-- 3. STUDENT SIGNUP FORM -->
        <div id="signupForm" class="form-section">
            <div id="signupInputSection">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name">
                </div>
                <div class="input-group">
                    <label>College ID / Roll No</label>
                    <input type="text" id="regId" placeholder="e.g. 25367">
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="regMobile" placeholder="Enter 10-digit number" maxlength="10">
                </div>
                <button class="btn" onclick="sendSignupOTP()" id="regSendOtpBtn">Send OTP</button>
                
                <div class="divider"><span>OR</span></div>
                <div style="display: flex; justify-content: center; width: 100%;">
                    <div class="g_id_signin" 
                         data-type="standard" 
                         data-shape="rectangular" 
                         data-theme="filled_black" 
                         data-text="signup_with" 
                         data-size="large" 
                         data-logo_alignment="left">
                    </div>
                </div>

                <div class="signup-text">Already have an account? <span onclick="toggleSignupView(false)">Login</span></div>
            </div>

            <!-- Signup OTP Section -->
            <div id="signupOtpSection" class="otp-section">
                <p style="color: #00F260; font-size: 13px; margin-bottom: 15px;">OTP sent to <span id="regDisplayNum"></span></p>
                <div class="input-group">
                    <label>Enter 4-Digit OTP</label>
                    <input type="number" id="regOtpInput" placeholder="0000" maxlength="4">
                </div>
                <button class="btn" onclick="verifySignupOTP()" id="regVerifyOtpBtn">Create Account</button>
                <p style="margin-top: 20px; font-size: 12px; color: #a4b0be; cursor: pointer;" onclick="toggleSignupView(false)">← Cancel Registration</p>
            </div>
        </div>
    </div>

    <script>
        let currentNumber = "";
        let regNumber = "";

        function showToast(message, title = 'Success!', type = 'success') {
            const toast = document.getElementById('customToast');
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = message;
            
            if(type === 'error') {
                toast.style.borderColor = '#ff4757';
                document.getElementById('toastTitle').style.color = '#ff4757';
                document.getElementById('toastIcon').style.background = 'rgba(255, 71, 87, 0.1)';
                document.getElementById('toastIcon').innerText = '❌';
            } else {
                toast.style.borderColor = '#00F260';
                document.getElementById('toastTitle').style.color = '#00F260';
                document.getElementById('toastIcon').style.background = 'rgba(0, 242, 96, 0.1)';
                document.getElementById('toastIcon').innerText = '✅';
            }
            
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function switchForm(type) {
            const toggleBtn = document.getElementById('toggleBtn');
            const studentForm = document.getElementById('studentForm');
            const adminForm = document.getElementById('adminForm');
            const formTitle = document.getElementById('formTitle');

            if (type === 'student') {
                toggleBtn.style.left = '0';
                studentForm.classList.add('active');
                adminForm.classList.remove('active');
                formTitle.innerHTML = 'Welcome to Student<br>Complaint Box 🏫';
            } else {
                toggleBtn.style.left = '50%';
                adminForm.classList.add('active');
                studentForm.classList.remove('active');
                formTitle.innerHTML = 'Admin Portal 🛡️';
            }
        }

        function toggleSignupView(isSignup) {
            const toggleBox = document.getElementById('toggleBox');
            const studentForm = document.getElementById('studentForm');
            const signupForm = document.getElementById('signupForm');
            const formTitle = document.getElementById('formTitle');
            const adminForm = document.getElementById('adminForm');

            if (isSignup) {
                toggleBox.style.display = 'none';
                studentForm.classList.remove('active');
                adminForm.classList.remove('active');
                signupForm.classList.add('active');
                formTitle.innerHTML = 'Create Account 🎓';
                
                document.getElementById('signupInputSection').style.display = 'block';
                document.getElementById('signupOtpSection').style.display = 'none';
            } else {
                toggleBox.style.display = 'flex';
                signupForm.classList.remove('active');
                switchForm('student');
            }
        }

        function handleCredentialResponse(response) {
            showToast("Google Login Successful! ✅", "Welcome", "success");
            
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            
            localStorage.setItem('loggedInUser', data.email);
            localStorage.setItem('userRole', 'student');
            
            const studentData = {
                name: data.name,
                rollId: data.email, 
                college: "Google Verified User", 
                dept: "", year: ""
            };
            localStorage.setItem('studentProfileData', JSON.stringify(studentData));
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        }

        function sendOTP() {
            const num = document.getElementById('mobileNumber').value;
            if(num.length !== 10) return showToast("Enter a valid 10-digit number.", "Error!", "error");
            
            document.getElementById('sendOtpBtn').innerText = "Sending... ⏳";
            setTimeout(() => {
                currentNumber = num;
                document.getElementById('displayNum').innerText = "+91 " + num;
                document.getElementById('mobileSection').style.display = 'none';
                document.getElementById('otpSection').style.display = 'block';
            }, 800);
        }

        function verifyOTP() {
            const otp = document.getElementById('otpInput').value;
            document.getElementById('verifyOtpBtn').innerText = "Verifying... ⏳";
            setTimeout(() => {
                if(otp === "1234") {
                    localStorage.setItem('loggedInUser', currentNumber);
                    localStorage.setItem('userRole', 'student');
                    window.location.href = 'dashboard.html';
                } else {
                    showToast("Invalid OTP! Enter 1234", "Error!", "error");
                    document.getElementById('verifyOtpBtn').innerText = "Verify & Login";
                }
            }, 800);
        }

        function sendSignupOTP() {
            const name = document.getElementById('regName').value;
            const id = document.getElementById('regId').value;
            const num = document.getElementById('regMobile').value;

            if(!name || !id) return showToast("Please fill all details.", "Error!", "error");
            if(num.length !== 10) return showToast("Enter a valid 10-digit number.", "Error!", "error");
            
            document.getElementById('regSendOtpBtn').innerText = "Sending... ⏳";
            setTimeout(() => {
                regNumber = num;
                document.getElementById('regDisplayNum').innerText = "+91 " + num;
                document.getElementById('signupInputSection').style.display = 'none';
                document.getElementById('signupOtpSection').style.display = 'block';
            }, 800);
        }

        function verifySignupOTP() {
            const otp = document.getElementById('regOtpInput').value;
            document.getElementById('regVerifyOtpBtn').innerText = "Creating... ⏳";
            
            setTimeout(() => {
                if(otp === "1234") {
                    const studentData = {
                        name: document.getElementById('regName').value,
                        rollId: document.getElementById('regId').value,
                        college: "", dept: "", year: ""
                    };
                    localStorage.setItem('studentProfileData', JSON.stringify(studentData));
                    localStorage.setItem('loggedInUser', regNumber);
                    localStorage.setItem('userRole', 'student');
                    window.location.href = 'dashboard.html';
                } else {
                    showToast("Invalid OTP! Enter 1234", "Error!", "error");
                    document.getElementById('regVerifyOtpBtn').innerText = "Create Account";
                }
            }, 800);
        }

        async function handleAdminLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            const loginBtn = document.querySelector('#adminForm .btn');
            loginBtn.innerText = "Verifying... ⏳";

            try {
                const response = await fetch('https://student-complaint-box-3kc3.onrender.com/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('userRole', 'admin');
                    window.location.href = "admin.html";
                } else {
                    showToast(result.message, "Error!", "error");
                    loginBtn.innerText = "Admin Login";
                }
            } catch (error) {
                showToast("Server Offline! Try again.", "Error!", "error");
                loginBtn.innerText = "Admin Login";
            }
        }

        window.onload = () => {
            if(localStorage.getItem('userRole') === 'student' && localStorage.getItem('loggedInUser')) {
                window.location.href = 'dashboard.html';
            } else if(localStorage.getItem('userRole') === 'admin') {
                window.location.href = 'admin.html';
            }
        }
    </script>
</body>
</html>
